<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- UTF-8 lets the page display any character in any language -->
    <meta charset="UTF-8">
    <!-- viewport prevents mobile browsers from zooming out to fake desktop width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title appears in the browser tab and in search engine results -->
    <title>HTML Document Skeleton</title>
  </head>
  <body>
    <!-- Everything inside <body> is visible to your visitors -->
    <h1>This is the HTML Document Skeleton</h1>
    <p>Open the Elements tab in Chrome DevTools (F12) to see this structure as a tree.</p>
  </body>
</html>
